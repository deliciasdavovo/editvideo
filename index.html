<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193c32"><title>VideoEdit — Organizador visual</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand">◼ VideoEdit <small>Organizador visual de vídeos</small></div><button id="newProject">+ Novo projeto</button></header><main><aside><h2>Meus projetos</h2><div id="projects"></div></aside><section class="workspace"><div id="empty"><h1>Organize seu próximo vídeo</h1><p>Crie um projeto, cole seu roteiro e associe imagens a cada cena.</p></div><div id="editor" hidden><div class="top"><input id="projectTitle" aria-label="Nome do projeto"><button id="deleteProject" class="secondary">Excluir projeto</button></div><label for="script">Roteiro</label><textarea id="script" rows="7" placeholder="Cole aqui o texto completo do vídeo..."></textarea><div class="actions"><label>Duração por cena <input id="seconds" type="number" min="1" max="15" value="3"> s</label><label>Palavras por minuto <input id="wpm" type="number" min="60" max="240" value="140"></label><button id="split">Dividir em cenas</button><button id="export" class="secondary">Exportar para IA (.zip)</button></div><p id="notice" role="status"></p><div class="scenehead"><h2>Cenas</h2><span id="sceneCount"></span></div><div id="scenes" class="scenes"></div></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="app.js"></script></body></html>
